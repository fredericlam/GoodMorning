function renderCourbe(notes) {
  const el = $("#courbe");
  const sorted = notes.filter(valid).sort((a, b) => a.date.localeCompare(b.date));
  const dates = [...new Set(sorted.map(n => n.date))];
  if (dates.length < 2) { el.innerHTML = `<div class="empty"><span class="big">${ic("chart-line-up")}</span>La courbe apparaîtra avec quelques notes de plus</div>`; return; }
  // moyenne cumulée : moyenne des moyennes par matière à chaque date
  const pts = dates.map(d => {
    const by = new Map();
    for (const n of sorted) if (n.date <= d) { const k = n.codeMatiere || n.matiere; const s = by.get(k) || [0, 0]; s[0] += on20(n.valeur, n.sur) * n.coef; s[1] += n.coef; by.set(k, s); }
    const m = [...by.values()].map(([a, w]) => a / w);
    return { d, v: m.reduce((a, b) => a + b, 0) / m.length };
  });
  const W = 520, H = 200, L = 28, R = 10, T = 14, B = 24;
  const vals = pts.map(p => p.v);
  let lo = Math.max(0, Math.floor(Math.min(...vals) - 1.5)), hi = Math.min(20, Math.ceil(Math.max(...vals) + 1.5));
  if (hi - lo < 4) { lo = Math.max(0, hi - 4); hi = lo + 4; }
  const t0 = parseDay(dates[0]).getTime(), t1 = parseDay(dates.at(-1)).getTime();
  const x = d => L + (parseDay(d).getTime() - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = hi - lo > 8 ? 4 : 2;
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la moyenne">
    <defs>
      <linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#ff5fa2"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
      <linearGradient id="ca" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff5fa2" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
    </defs>`;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  svg += `<text x="${L}" y="${H - 4}">${esc(fdate(dates[0], { day: "numeric", month: "short" }))}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${esc(fdate(dates.at(-1), { day: "numeric", month: "short" }))}</text>`;
  svg += `<path d="${line}L${x(dates.at(-1))},${H - B}L${x(dates[0])},${H - B}Z" fill="url(#ca)"/>`;
  svg += `<path d="${line}" fill="none" stroke="url(#cg)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last = pts.at(-1);
  svg += `<circle cx="${x(last.d)}" cy="${y(last.v)}" r="5.5" fill="#8b5cf6" stroke="var(--card-solid)" stroke-width="2.5"/>`;
  svg += `<line id="xh" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><circle id="xd" r="5.5" fill="#ff5fa2" stroke="var(--card-solid)" stroke-width="2.5" visibility="hidden"/>`;
  svg += `<rect id="hit" x="${L}" y="0" width="${W - L - R}" height="${H - B}" fill="transparent"/></svg>`;
  el.innerHTML = `<div class="chart">${svg}</div>`;
  const s = el.querySelector("svg"), xh = s.querySelector("#xh"), xd = s.querySelector("#xd"), hit = s.querySelector("#hit");
  hit.onmousemove = e => {
    e.stopPropagation();
    const r = s.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width * W;
    let best = pts[0]; for (const p of pts) if (Math.abs(x(p.d) - mx) < Math.abs(x(best.d) - mx)) best = p;
    xh.setAttribute("x1", x(best.d)); xh.setAttribute("x2", x(best.d)); xh.setAttribute("visibility", "visible");
    xd.setAttribute("cx", x(best.d)); xd.setAttribute("cy", y(best.v)); xd.setAttribute("visibility", "visible");
    const added = sorted.filter(n => n.date === best.d);
    showTip(`<b>${esc(fdate(best.d, { day: "numeric", month: "long" }))}</b><br>Moyenne : ${fmt(best.v, 2)}<br><span class="muted">${added.map(n => `${ic(subj(n.matiere, n.codeMatiere).icon)} ${esc(subj(n.matiere, n.codeMatiere).label)} ${fmtN(n.valeur)}/${n.sur}`).join("<br>")}</span>`, e);
  };
  hit.onmouseleave = () => { xh.setAttribute("visibility", "hidden"); xd.setAttribute("visibility", "hidden"); hideTip(); };
}

// ---------- sablier ----------
let hgN = 0;
function hourglass(frac, size = 44, running = false) {
  frac = Math.max(0, Math.min(1, frac || 0));
  const id = `hg${++hgN}`, top = 6 + (1 - frac) * 20, bot = 50 - (1 - frac) * 20;
  const bulbT = "M9 6 C9 18 18 23 18 28 L22 28 C22 23 31 18 31 6 Z", bulbB = "M18 28 C18 33 9 38 9 50 L31 50 C31 38 22 33 22 28 Z";
  return `<svg class="hg" width="${size * 40 / 56}" height="${size}" viewBox="0 0 40 56" role="img" aria-label="${Math.round(frac * 100)} % restant">
    <defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7ab6"/><stop offset="1" stop-color="var(--hg, #8b5cf6)"/></linearGradient>
      <clipPath id="${id}t"><path d="${bulbT}"/></clipPath><clipPath id="${id}b"><path d="${bulbB}"/></clipPath></defs>
    <path class="glass" d="${bulbT} ${bulbB}"/>
    <rect clip-path="url(#${id}t)" x="0" y="${top}" width="40" height="${28 - top}" fill="url(#${id}g)"/>
    <rect clip-path="url(#${id}b)" x="0" y="${bot}" width="40" height="${50 - bot}" fill="url(#${id}g)"/>
    ${running && frac > 0 ? `<line class="stream" x1="20" y1="28" x2="20" y2="${bot}"/>` : ""}
    <rect class="cap" x="5" y="2" width="30" height="4.5" rx="2.2"/><rect class="cap" x="5" y="49.5" width="30" height="4.5" rx="2.2"/>
  </svg>`;
}
// Comptes à rebours vivants : <span class="cd" data-e> et sabliers <span class="hgw" data-s data-e>, rafraîchis chaque seconde.
function cdText(ms) {
  if (ms <= 0) return "maintenant";
  const t = Math.floor(ms / 1000), d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return d ? `${d} j ${pad(h)}:${pad(m)}:${pad(s)}` : h ? `${h} h ${pad(m)} min ${pad(s)} s` : `${m} min ${pad(s)} s`;
}
const live = end => `<span class="cd" data-e="${end}">${cdText(end - Date.now())}</span>`;
const hgFrac = (s, e) => (e - Date.now()) / Math.max(1, e - s);
const liveHg = (s, e, size = 44, run = true) => `<span class="hgw" data-s="${s}" data-e="${e}" data-z="${size}" data-r="${run ? 1 : 0}">${hourglass(hgFrac(s, e), size, run)}</span>`;
const at = (dayIso, min) => { const d = parseDay(dayIso); d.setMinutes(min); return d.getTime(); };
const hm = str => { const [h, m] = (str || "08:00").split(":").map(Number); return h * 60 + (m || 0); };
let tickerExpired = false;
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll(".cd").forEach(el => {
    const left = +el.dataset.e - now;
    el.textContent = cdText(left);
    if (left <= 0 && left > -1500) tickerExpired = true;
  });
  document.querySelectorAll(".hgw").forEach(el => {
    el.innerHTML = hourglass(hgFrac(+el.dataset.s, +el.dataset.e), +el.dataset.z, el.dataset.r === "1");
  });
  if (tickerExpired && tab === "scolarite") { tickerExpired = false; renderHero(); renderCountdowns(); }
}, 1000);

function dur(ms) {
  const m = Math.max(0, Math.round(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return d ? `${d} j ${h} h` : h ? `${h} h ${pad(mm)}` : `${mm} min`;
}

// dernier jour ouvré avant une date (= dernier jour de cours avant des vacances)
const lastSchoolDay = d => { const x = parseDay(d); do x.setDate(x.getDate() - 1); while (x.getDay() === 0 || x.getDay() === 6); return iso(x); };
function renderVacances() {
  const el = $("#vacances"); if (!el) return;
  const cal = DATA.calendrier, t = today();
  const vac = (cal?.vacances || []).filter(v => v.reprise > v.debut);
  $("#vacsub").textContent = cal?.academie ? `Académie de ${cal.academie}${vac[0]?.zone ? " · " + vac[0].zone : ""}` : "";
  if (!vac.length) { el.innerHTML = `<div class="empty"><span class="big">${ic("island")}</span>Calendrier indisponible : ajoute <code>ED_ACADEMIE=…</code> dans <code>.env.local</code> puis <code>python ed_export.py vacances</code>.</div>`; return; }
  const now = new Date(), y = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1;
  const y0 = new Date(y, 8, 1), y1 = new Date(y + 1, 6, 10), span = y1 - y0;
  const X = d => `${Math.max(0, Math.min(100, (d - y0) / span * 100))}%`;
  const inYear = vac.filter(v => parseDay(v.reprise) > y0 && parseDay(v.debut) < y1);
  let strip = `<div class="year"><div class="rail"></div>`;
  for (const v of inYear) {
    const a = parseDay(v.debut), b = parseDay(v.reprise);
    strip += `<div class="hol ${v.reprise <= t ? "past" : ""}" style="left:${X(a)};width:calc(${X(b)} - ${X(a)})" data-tip="${esc(`<b>${esc(v.nom)}</b><br>du ${esc(fdate(v.debut, { day: "numeric", month: "long" }))} au ${esc(fdate(v.reprise, { day: "numeric", month: "long" }))}`)}"></div>`;
  }
  for (const ev of DATA.evenements || []) {
    const a = parseDay(ev.debut), b = parseDay(ev.fin || ev.debut); b.setDate(b.getDate() + 1);
    if (b > y0 && a < y1) strip += `<div class="hol evt" style="left:${X(a)};width:max(6px, calc(${X(b)} - ${X(a)}))" data-tip="${esc(`<b>${esc(ev.nom)}</b><br>${esc(fdate(ev.debut, { day: "numeric", month: "long" }))}${ev.fin ? " → " + esc(fdate(ev.fin, { day: "numeric", month: "long" })) : ""}`)}"></div>`;
  }
  for (let m = 0; m < 11; m++) { const d = new Date(y, 8 + m, 15); if (d < y1) strip += `<span class="mo" style="left:${X(d)}">${esc(new Date(y, 8 + m, 1).toLocaleDateString("fr-FR", { month: "short" }).replace(".", ""))}</span>`; }
  strip += `<div class="todaymk" style="left:${X(now)}"></div></div>`;
  const list = inYear.map(v => {
    const st = v.reprise <= t ? "past" : v.debut <= t ? "now" : "";
    return `<div class="hol-row ${st}"><div><b>${esc(v.nom)}</b><div class="m">${esc(fdate(v.debut, { weekday: "short", day: "numeric", month: "short" }))} → reprise ${esc(fdate(v.reprise, { weekday: "short", day: "numeric", month: "short" }))}</div></div>
      <span class="tag ${st === "now" ? "pop" : ""}">${st === "past" ? "passées" : st === "now" ? "en cours" : `J-${dayDiff(t, lastSchoolDay(v.debut))}`}</span></div>`;
  }).join("");
  el.innerHTML = `${strip}<div class="hol-list">${list}</div>`;
}

  { id: "s-apercu", label: "Aperçu", icon: "sparkle", dossier: true },
  { id: "s-devoirs", label: "Devoirs", icon: "note-pencil", dossier: true },
  { id: "s-cantine", label: "Cantine", icon: "bowl-food", dossier: true },
  { id: "archives", label: "Archives", icon: "files", enfant: true },
  { id: "garde", label: "Garde", icon: "calendar-heart", commun: true },  // panneau commun : bouton à côté des enfants
];
let tab = "scolarite", espIdx = 0;
const lastTabs = {};  // dernier onglet ouvert par espace (pour revenir de la Garde)
const espace = () => DATA.espaces?.[espIdx] || { source: "ecoledirecte" };

const tabsNow = () => {

function renderEspaces() {
  const el = $("#espaces"), es = DATA.espaces || [];
  el.hidden = es.length < 2;
  const btn = (e, i) => `<button type="button" data-e="${i}" class="${e.source === "papa" ? "esp-garde esp-papa" : ""}" aria-pressed="${i === espIdx && tab !== "garde"}">${e.source === "papa" ? ic(DATA.famille ? "user-circle" : "lock-simple") : kidAvatar(e.prenom, 22)}<span>${esc(e.prenom)}</span></button>`;
  const kids = es.map((e, i) => [e, i]).filter(([e]) => e.source !== "papa"), papa = es.map((e, i) => [e, i]).filter(([e]) => e.source === "papa");

    (DATA.garde && es.length ? `<span class="esp-sep" aria-hidden="true"></span><button type="button" data-e="garde" class="esp-garde" aria-pressed="${tab === "garde"}">${ic("calendar-heart")}<span>Garde</span></button>` : "");
  // Papa : à droite, près du bouton jour/nuit
  const pe = $("#espace-papa");

  pe.onclick = el.onclick = ev => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.e === "garde") return showTab("garde");
    if (+b.dataset.e !== espIdx) return switchEspace(+b.dataset.e, ev);
    showTab(lastTabs[espIdx] && tabsNow().some(t => t.id === lastTabs[espIdx]) ? lastTabs[espIdx] : tabsNow()[0].id);

const ESPACE_THEMES = { sakura: ["#fff6f1", "#140c1b"], mandarine: ["#fff8ec", "#0d1716"], laiton: ["#f2f4f8", "#0a0f1d"] };  // couleurs barre d'état iOS (jour, nuit)
function applyEspaceTheme() {
  const e = espace(), th = ESPACE_THEMES[e.theme] ? e.theme : "sakura";
  document.documentElement.dataset.espaceTheme = th;
  document.querySelectorAll('meta[name="theme-color"]').forEach((m, j) => m.setAttribute("content", ESPACE_THEMES[th][j] || ESPACE_THEMES[th][0]));
}
function switchEspace(i, ev) {
  const run = () => selectEspace(i);
  if (!document.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches) return run();
  const r = ev?.target.closest("button")?.getBoundingClientRect();
  const x = r ? r.left + r.width / 2 : innerWidth / 2, y = r ? r.top + r.height / 2 : 0;
  const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  document.startViewTransition(run).ready.then(() => document.documentElement.animate(
    { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] },
    { duration: 650, easing: "cubic-bezier(.2, .8, .2, 1)", pseudoElement: "::view-transition-new(root)" }));
}
function selectEspace(i) {
  espIdx = i; store.set("ed-espace", String(i));
  applyEspaceTheme();
  document.querySelectorAll("#espaces button, #espace-papa button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.e === i)));
  const e = espace();
  if (e.source === "papa") {
    DATA.famille ? renderFamille() : renderPapaLock();
    $("#footer").innerHTML = `Espace Papa · messagerie, documents et factures EcoleDirecte · ${DATA.famille ? "déverrouillé" : "verrouillé"}`;
  } else if (e.source === "dossier") {
    renderDossier(e);
    $("#footer").innerHTML = `Espace ${esc(e.prenom)} · imports du dossier <code>${esc(e.dossier || "sources")}/</code>${e.etablissement ? " · " + esc(e.etablissement) : ""}`;
  } else {
    const k = DATA.children.findIndex(c => c.prenom === e.prenom);
    selectKid(k >= 0 ? k : kidIdx);
  }
  renderArchives();
  renderTabs();
  const back = tab !== "garde" && tabsNow().some(t => t.id === tab) ? tab : lastTabs[i];
  showTab(back && tabsNow().some(t => t.id === back) ? back : tabsNow()[0].id);
}
function renderTabs() {
  const f = DATA.famille || {};
  const badge = { messagerie: (f.messages || []).filter(m => m.box === "received" && !m.read).length,
                  documents: (f.documents || []).filter(d => d.signatureDemandee).length + (f.pieces?.listes?.length || 0) };
  $("#tabs").innerHTML = tabsNow().map(t => `<button type="button" data-t="${t.id}" aria-pressed="${t.id === tab}" title="${t.label}">${ic(t.icon)}<span class="lbl">${t.label}</span>${badge[t.id] ? `<span class="count">${badge[t.id]}</span>` : ""}</button>`).join("");
  if (espace().source === "papa" && DATA.famille && !DATA.demo)
    $("#tabs").insertAdjacentHTML("beforeend", `<button type="button" data-lock="1" title="Verrouiller l'espace Papa">${ic("lock-simple")}<span class="lbl">Verrouiller</span></button>`);
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.lock) return lockPapa(); showTab(b.dataset.t); };
}
function showTab(id) {
  tab = id; store.set("ed-tab", id);
  if (id !== "garde") lastTabs[espIdx] = id;
  // Garde = panneau commun : bouton actif dans le sélecteur d'espace, barre d'onglets masquée
  document.querySelectorAll("#espaces button, #espace-papa button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.e === "garde" ? id === "garde" : id !== "garde" && +b.dataset.e === espIdx)));
  $("#tabs").hidden = id === "garde" && !!DATA.espaces?.length;
  if (location.hash.slice(1).split("/")[0] !== id) history.replaceState(null, "", "#" + id);
  TABS.forEach(t => { $(`#pane-${t.id}`).hidden = t.id !== id; });
  $("#tabs").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === id)));
  const sco = id === "scolarite";
  $("#kids").hidden = !sco || DATA.children.length < 2;
  if (sco && $("#subnav")) showSub(sub);
  hideTip(); scrollTo({ top: 0 });
}
addEventListener("hashchange", () => {
  const [h, sp] = location.hash.slice(1).split("/");
  if ((tabsNow().some(t => t.id === h) || h === "garde") && h !== tab) showTab(h);
  if (h === "scolarite" && sp && sp !== sub) showSub(sp);
});

// ---------- fichiers & visionneuse ----------
const fileUrl = f => `files/${encodeURIComponent(f.path)}`;
const fsize = n => n == null ? "" : n < 1024 ? `${n} o` : n < 1048576 ? `${Math.round(n / 1024)} Ko` : `${(n / 1048576).toFixed(1).replace(".", ",")} Mo`;
const FILES = [];
function fileBtns(f, label = "Voir") {
  if (!f) return `<span class="btn off" title="Fichier non téléchargé (données démo ou échec du fetch)">${ic("eye")}${label}</span>`;
  FILES.push(f);
  return `<button type="button" class="btn primary" data-view="${FILES.length - 1}">${ic("eye")}${label}</button>
    <a class="btn" href="${f.url || fileUrl(f)}" download="${esc(f.name)}">${ic("download-simple")}${fsize(f.size)}</a>`;
}
function openViewer(f) {
  const url = f.url || fileUrl(f), v = $("#viewer");
  $("#vtitle").textContent = f.name;
  $("#vopen").href = url; $("#vopen").innerHTML = `${ic("arrow-square-out")}Ouvrir`;
  $("#vdl").href = url; $("#vdl").download = f.name; $("#vdl").innerHTML = `${ic("download-simple")}Télécharger`;
  $("#vclose").innerHTML = ic("x");
  $("#vbody").innerHTML = /^image\//.test(f.mime) ? `<img class="vimg" src="${url}" alt="${esc(f.name)}">`
    : /pdf|text\//.test(f.mime) ? `<iframe src="${url}" title="${esc(f.name)}"></iframe>`
    : `<div class="empty"><span class="big">${ic("file-text")}</span>Aperçu indisponible pour ce type de fichier (${esc(f.mime || "?")}).</div>`;
  v.hidden = false;
}
const closeViewer = () => { $("#viewer").hidden = true; $("#vbody").innerHTML = ""; };
$("#vclose").onclick = closeViewer;
$("#viewer").onclick = e => { if (e.target.id === "viewer") closeViewer(); };
addEventListener("keydown", e => { if (e.key === "Escape") closeViewer(); });
document.addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) openViewer(FILES[+b.dataset.view]); });

// ---------- espace Papa : déverrouillage (ED_PAPA_PASS, vérifié côté serveur) ----------
async function loadPapa() {
  try { const r = await fetch("papa.json", { cache: "no-store" }); DATA.famille = r.ok ? (await r.json()).famille : null; }
  catch { DATA.famille = null; }
}
function renderPapaLock(msg = "") {
  const configured = DATA.papa?.configure;
  const card = `<div class="card lock-card rise">
    <div class="lock-ic">${parentPortrait("papa", 70, "wave")}<span class="lock-badge">🔐</span></div><h2>Espace Papa</h2>
    <p>Messagerie, documents et factures EcoleDirecte.</p>
    ${configured ? `<form class="lock-form" autocomplete="on"><input type="text" name="username" value="papa" autocomplete="username" hidden>
      <input class="input" type="password" name="password" placeholder="Mot de passe" autocomplete="current-password" required>
      <button class="btn primary" type="submit">${ic("lock-simple")}Déverrouiller</button></form>
      <p class="lock-msg">${esc(msg)}</p>`
    : `<p class="lock-msg">Ajoute <code>ED_PAPA_PASS=…</code> dans <code>.env.local</code> puis relance <code>python ed_export.py serve</code>.</p>`}</div>`;
  for (const id of ["messagerie", "documents", "factures"]) $(`#pane-${id}`).innerHTML = card;
  document.querySelectorAll(".lock-form").forEach(f => f.onsubmit = async ev => {
    ev.preventDefault();
    const btn = f.querySelector("button"), pw = f.password.value;
    btn.disabled = true;
    let r = null;
    try { r = await fetch("papa/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw }) }); } catch {}
    if (r?.ok) { await loadPapa(); renderEspaces(); selectEspace(espIdx); return; }
    renderPapaLock(r?.status === 403 ? "Mot de passe incorrect." : "Serveur injoignable.");
    $(`#pane-${tab} .lock-card`)?.classList.add("shake");
    $(`#pane-${tab} input[type=password]`)?.focus();
  });
  if (espace().source === "papa") setTimeout(() => $(`#pane-${tab} input[type=password]`)?.focus(), 50);
}
async function lockPapa() {
  try { await fetch("papa/logout", { method: "POST" }); } catch {}
  DATA.famille = null; FILES.length = 0;
  renderEspaces(); selectEspace(espIdx);
}

// ---------- famille ----------
const initials = n => (n || "?").replace(/^(M\.|Mme|Mlle|Mr)\s+/i, "").split(/[\s-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const colorOf = n => { let h = 0; for (const c of n || "") h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const linkify = t => esc(t).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const mdate = s => s ? new Date(s.replace(" ", "T")) : null;
function whenLabel(s) {
  const d = mdate(s); if (!d || isNaN(d)) return "";
  const n = dayDiff(iso(d), today());
  return n === 0 ? d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : n === 1 ? "hier" : n < 7 ? cap(d.toLocaleDateString("fr-FR", { weekday: "short" })) : d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}
function paneHead(title, sub) { return `<div class="pane-head rise"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div></div>`; }
function missing(f, key, what) { return (f.erreurs || []).includes(key) ? `<div class="err-card">${what} : échec au dernier fetch.</div>` : ""; }

function renderFamille() {
  const f = DATA.famille;
  if (!f) {
    for (const id of ["messagerie", "documents", "factures"])
      $(`#pane-${id}`).innerHTML = `<div class="card empty"><span class="big">${ic("tray")}</span>Pas encore de données famille : relance <code>python ed_export.py fetch</code>.</div>`;
    return;
  }
  renderMessagerie(f); renderDocuments(f); renderFactures(f);
}

let mailBox = "received", mailQuery = "", mailSel = null;
function renderMessagerie(f) {
  const st = f.messagesStats || {};
  $("#pane-messagerie").innerHTML = paneHead("Messagerie", `${st.recus ?? "–"} reçus · ${st.nonLus ?? 0} non lus · ${st.envoyes ?? "–"} envoyés`) +
    missing(f, "messages_received", "Messagerie") +
    `<div class="mail rise" id="mail">
      <div class="card mail-list">
        <div class="search">${ic("magnifying-glass")}<input class="input" id="mq" type="search" placeholder="Rechercher (objet, expéditeur, contenu)…" value="${esc(mailQuery)}"></div>
        <div class="pills" id="mbox" style="margin-bottom:10px"><button type="button" data-b="received">${ic("tray")}Reçus</button><button type="button" data-b="sent">${ic("paper-plane-tilt")}Envoyés</button><button type="button" data-b="pj">${ic("paperclip")}Avec PJ</button></div>
        <div class="mail-items" id="mitems"></div>
      </div>
      <div class="card mread" id="mread"></div>
    </div>`;
  $("#mq").oninput = e => { mailQuery = e.target.value; renderMailList(f); };
  $("#mbox").onclick = e => { const b = e.target.closest("button"); if (b) { mailBox = b.dataset.b; renderMailList(f); } };
  renderMailList(f);
}
function renderMailList(f) {
  $("#mbox").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.b === mailBox)));
  const q = mailQuery.trim().toLowerCase();
  const list = (f.messages || []).filter(m => (mailBox === "pj" ? m.attachments.length : m.box === mailBox) &&
    (!q || `${m.subject} ${m.from} ${m.to.join(" ")} ${m.content || ""}`.toLowerCase().includes(q)));
  $("#mitems").innerHTML = list.length ? list.map(m => {
    const who = m.box === "sent" ? `À : ${m.to.join(", ") || "?"}` : m.from;
    return `<div class="mitem ${m.box === "received" && !m.read ? "unread" : ""}" data-id="${m.id}" aria-current="${m.id === mailSel}" role="button" tabindex="0">
      ${m.box === "sent" ? senderAvatar(m.to[0], "", 40) : senderAvatar(m.from, m.fromRole, 40)}
      <div style="min-width:0"><div class="who">${esc(who)}</div><div class="sub">${esc(m.subject)}</div></div>
      <div class="when">${esc(whenLabel(m.date))}${m.attachments.length ? ic("paperclip") : ""}${m.box === "received" && !m.read ? `<i class="udot"></i>` : ""}</div></div>`;
  }).join("") : emptyState("vide", "Aucun message");
  const open = id => { mailSel = id; renderMailList(f); renderMail(f); $("#mail").classList.add("reading"); };
  $("#mitems").onclick = e => { const it = e.target.closest(".mitem"); if (it) open(+it.dataset.id); };
  $("#mitems").onkeydown = e => { const it = e.target.closest(".mitem"); if (it && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(+it.dataset.id); } };

function renderMail(f) {
  const m = (f.messages || []).find(x => x.id === mailSel), el = $("#mread");
  if (!m) { el.innerHTML = `<div class="empty"><span class="big">${ic("envelope-simple")}</span>Sélectionne un message</div>`; return; }
  const who = m.box === "sent" ? (m.to.join(", ") || "?") : m.from;
  el.innerHTML = `<button type="button" class="btn back" id="mback">${ic("arrow-left")}Retour</button>
    <h2>${esc(m.subject)}</h2>
    <div class="meta">${m.box === "sent" ? senderAvatar(m.to[0], "", 48) : senderAvatar(m.from, m.fromRole, 48)}
      <div><div class="n">${m.box === "sent" ? "À : " : ""}${esc(who)} ${m.fromRole && m.box !== "sent" ? `<span class="tag">${esc(m.fromRole)}</span>` : ""}</div>
      <div class="d">${esc(mdate(m.date)?.toLocaleString("fr-FR", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) || "")}${m.box !== "sent" && m.to.length ? ` · à ${esc(m.to.join(", "))}` : ""}</div></div>

    ${m.attachments.length ? `<div class="atts">${m.attachments.map(a => `<div class="doc" style="flex:1 1 240px"><div class="bubble">${ic(/\.(png|jpe?g|gif|webp)$/i.test(a.name) ? "image" : /\.pdf$/i.test(a.name) ? "file-pdf" : "file-text")}</div><div style="min-width:0"><h4>${esc(a.name)}</h4><div class="d">pièce jointe</div><div class="acts">${fileBtns(a.file)}</div></div></div>`).join("")}</div>` : ""}`;
  $("#mback").onclick = () => $("#mail").classList.remove("reading");

let docSub = store.get("ed-docsub") || "recus";
function renderDocuments(f) {

// ---------- garde partagée (garde.json) ----------
// Semaine : lun → jeu papa, jeu soir → sam midi maman ; 1 week-end sur 2 chez papa (sam midi → dim).
// Vacances (≥ 1 semaine) : 1 semaine chacun, relais le samedi. Chaque jour = { am, pm } par enfant.
const PARENT = { papa: "Papa", maman: "Maman" };
const handover = s => parseDay(s).getDay() === 6 ? "midi" : "soir"; // samedi : relais à midi
function gardeDays(G, from, to) {
  const other = p => p === "papa" ? "maman" : "papa";
  const vac = (DATA.calendrier?.vacances || []).filter(v => dayDiff(v.debut, v.reprise) >= 7);
  const holiday = s => vac.find(v => v.debut <= s && s < v.reprise);
  const base = (s, prevPm) => {
    const h = holiday(s);
    if (h) {
      const n = dayDiff(h.debut, s), weeks = Math.round(dayDiff(h.debut, h.reprise) / 7);
      const first = G.vacances?.[h.nom] || G.vacancesPremiereSemaine || "maman";
      const p = Math.min(Math.floor(n / 7), weeks - 1) % 2 ? other(first) : first;
      return { am: n % 7 === 0 && prevPm ? prevPm : p, pm: p, vac: h.nom };
    }
    const d = parseDay(s), wd = d.getDay();
    const sat = iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() - (wd === 0 ? 1 : 0)));
    const papaWE = ((Math.round(dayDiff(G.weekendPapa, sat) / 7) % 2) + 2) % 2 === 0;
    return wd >= 1 && wd <= 3 ? { am: "papa", pm: "papa" } : wd === 4 ? { am: "papa", pm: "maman" }
      : wd === 5 ? { am: "maman", pm: "maman" } : wd === 6 ? { am: "maman", pm: papaWE ? "papa" : "maman" }
      : papaWE ? { am: "papa", pm: "papa" } : { am: "maman", pm: "maman" };
  };
  const days = [];
  let prevPm = null;
  for (let d = parseDay(from); iso(d) <= to; d.setDate(d.getDate() + 1)) {
    const s = iso(d), b = base(s, prevPm);
    prevPm = b.pm;
    days.push({ s, vac: b.vac, kids: Object.fromEntries((G.enfants || []).map(k => [k, { am: b.am, pm: b.pm }])) });
  }
  days.forEach((day, i) => {
    const next = days[i + 1];
    for (const k of G.dimancheSoirChezPapa || []) {
      const c = day.kids[k];
      if (c && parseDay(day.s).getDay() === 0 && c.pm === "maman" && next?.kids[k]?.am === "papa") c.pm = "papa";
    }
    for (const x of G.exceptions || []) {
      if (day.s < x.date || day.s > (x.fin || x.date)) continue;
      for (const k of x.enfants || G.enfants || []) if (day.kids[k]) Object.assign(day.kids[k], x.matin && { am: x.matin }, x.soir && { pm: x.soir });
    }
  });
  return days;
}
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return iso(d); };
const mondayOf = s => addDays(s, -((parseDay(s).getDay() + 6) % 7));
let gardeView = store.get("ed-garde-view") === "mois" ? "mois" : "semaine", gardeWeek = null;
// Avatars (SVG maison) : chignon + frange façon geisha, pic à cheveux fleuri ; couleurs dans garde.json → avatars.

    <path d="M29.5 47.5q2.5 2.2 5 0" fill="none" stroke="#e0435f" stroke-width="2" stroke-linecap="round"/>

const kidName = (k, size) => `<span class="kname">${kidAvatar(k, size)}${esc(k)}</span>`;
function renderGarde() {
  const G = DATA.garde, el = $("#pane-garde");
  if (!G?.enfants?.length) {
    el.innerHTML = paneHead("Garde partagée") + `<div class="card empty"><span class="big">${ic("calendar-heart")}</span>Ajoute <code>garde.json</code> puis relance <code>python ed_export.py normalize</code>.</div>`;
    return;
  }
  const t = today(), d0 = parseDay(t);
  // début d'année scolaire (1er septembre), pas le 1er du mois en cours (sinon fin septembre « hors année » dès octobre)
  const from = `${d0.getFullYear() - (d0.getMonth() < 7 ? 1 : 0)}-09-01`;
  const ete = (DATA.calendrier?.vacances || []).find(v => /été/i.test(v.nom) && v.debut > t);
  const to = addDays(ete ? ete.debut : `${d0.getFullYear() + (d0.getMonth() >= 7 ? 1 : 0)}-07-04`, -1);
  const first = mondayOf(from), last = mondayOf(to);
  const days = gardeDays(G, first, addDays(last, 6)), byDay = new Map(days.map(d => [d.s, d]));
  gardeWeek = gardeWeek || mondayOf(t);
  gardeWeek = gardeWeek < first ? first : gardeWeek > last ? last : gardeWeek;
  const inRange = s => s >= from && s <= to;
  const who = (c, full, s) => c.am === c.pm ? `<span class="p-${c.pm}">${PARENT[c.pm]}</span>`
    : `<span class="p-${c.am}">${PARENT[c.am]}</span>${full ? " le matin" : ""} → <span class="p-${c.pm}">${PARENT[c.pm]}</span>${full ? (handover(s) === "midi" ? " l'après-midi" : " le soir") : ""}`;
  const todayDay = byDay.get(t);
  const tonight = todayDay ? (() => {
    const ps = new Set(G.enfants.map(k => todayDay.kids[k].pm));

      : "Ce soir : " + G.enfants.map(k => `${k} chez ${PARENT[todayDay.kids[k].pm].toLowerCase()}`).join(" · ");
  })() : "";
  const legend = extra => `<div class="g-legend">
      <span>${parentPortrait("papa", 26)}Papa</span><span>${parentPortrait("maman", 26)}Maman</span>

    const relais = [];

      const moves = new Map();
      for (const k of G.enfants) {
        const c = d.kids[k], pc = prev?.kids[k];

    body = `<section class="card g-wnav rise">

      </section>

      <div class="g-months">${[...months].map(([m, ds]) => {

    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 8}" y="${y(v) + 4}" class="ax" text-anchor="end">${v}</text>`).join("")}
    ${seps.map(sx => `<line x1="${sx}" x2="${sx}" y1="${T - 10}" y2="${H - B}" class="sep"/>`).join("")}
    <path d="${line("cls")}" class="l-cls"/><path d="${line("moy")}" class="l-me"/>
    ${pts.map((p, i) => `<text x="${x(i)}" y="${H - 10}" class="ax" text-anchor="middle">${esc(p.label)}</text>
      ${p.cls != null ? `<circle cx="${x(i)}" cy="${y(p.cls)}" r="3.5" class="d-cls"/>` : ""}
      ${p.moy != null ? `<circle cx="${x(i)}" cy="${y(p.moy)}" r="5" class="d-me${p.live ? " live" : ""}"/>` : ""}

      <rect x="${x(i) - 20}" y="${T - 14}" width="40" height="${H - T - B + 14}" fill="transparent" data-tip="${esc(`<b>${esc(p.label)}</b> · ${esc(p.annee)}<br>Moyenne : <b>${fmt(p.moy, 2)}</b>${p.cls != null ? `<br>Classe : ${fmt(p.cls, 2)}` : ""}${p.mention ? `<br>${MENTION_IC[p.mention] || ""} ${esc(p.mention)}` : ""}${p.live ? "<br><span class='muted'>estimée depuis les notes</span>" : ""}`)}"/>`).join("")}

}

  const bySubj = new Map();
  for (const n of apiNotes) (bySubj.get(skey(n.matiere)) || bySubj.set(skey(n.matiere), []).get(skey(n.matiere))).push(n);
  const chips = ns => ns.length ? `<div class="gchips">${ns.sort((a, b) => a.date.localeCompare(b.date)).map(n => `<span class="gchip${n.nonSignificatif ? " ns" : ""}" data-tip="${esc(`<b>${esc(n.devoir || "Évaluation")}</b><br>${esc(fdate(n.date, { day: "numeric", month: "long" }))}${n.coef !== 1 ? ` · coef ${fmtN(n.coef)}` : ""}${n.moyenneClasse != null ? `<br>Classe : ${fmtN(n.moyenneClasse)}/${n.sur}` : ""}`)}">${n.valeur != null ? fmtN(n.valeur) : esc(n.brut || "–")}<small>/${n.sur}</small></span>`).join("")}</div>` : "";
  const used = new Set();
  body.innerHTML = `<section class="card rise arch-head">
      <div><h2>${esc(classeCourte(y.classe))} · ${esc(y.annee)}</h2><div class="m">${t ? `${esc(t.classe)} · professeur principal ${esc(t.pp || "–")}` : `${plural((y.notes || []).length, "note")} EcoleDirecte · pas de bulletin archivé`}</div></div>
      <span class="spacer"></span>
      ${trims.length ? `<div class="pills" id="tri">${trims.map(x => `<button type="button" data-t="${x.trimestre}" aria-pressed="${x.trimestre === ti}">T${x.trimestre}${x.mention ? ` ${MENTION_IC[x.mention] || ""}` : ""}</button>`).join("")}</div>` : ""}
      ${archFiles(y)}
    </section>` +
    (t ? `<section class="card rise"><div class="arch-conseil">
        ${t.mention ? `<span class="tag good big">${MENTION_IC[t.mention] || ""} ${esc(t.mention)} du conseil</span>` : ""}
        ${t.decision ? `<span class="tag">${ic("arrow-square-out")}${esc(t.decision)}</span>` : ""}
        <span class="tag">${t.absences?.demiJournees ?? 0} demi-journée(s) d'absence · ${t.absences?.retards ?? 0} retard(s)</span></div>
        ${quoteBlock(t.pp, t.avis, { role: "pp", meta: `avis du conseil · T${ti}` })}</section>
      <section class="card rise"><div class="card-head"><h2>Matières</h2><span class="spacer"></span><span class="sub">bulletin T${ti}${apiNotes.length ? ` · ${plural(apiNotes.length, "note")} EcoleDirecte` : ""}</span></div>
        <div class="legend"><span><i class="l-me"></i>${esc(prenom)}</span><span><i class="l-avg"></i>Moy. classe</span><span><i class="l-band"></i>Min – max classe</span></div>
        <div class="arch-subjects">${t.matieres.map(m => {
          const s = subj(m.matiere), X = v => `${Math.max(0, Math.min(100, v / 20 * 100))}%`, ns = bySubj.get(skey(m.matiere)) || [];
          used.add(skey(m.matiere));
          return `<div class="as-row" style="${cvar(s.color)}">
            <div class="bubble sm">${ic(s.icon)}</div>
            <div style="min-width:0"><div class="as-n">${esc(s.label)} <span class="m">${esc(m.prof)}</span></div>
              ${m.eleve != null ? `<div class="range"><div class="tr"></div>${m.min != null && m.max != null ? `<div class="band" style="left:${X(m.min)};width:calc(${X(m.max)} - ${X(m.min)})"></div>` : ""}${m.classe != null ? `<div class="avg" style="left:${X(m.classe)}"></div>` : ""}<div class="me" style="left:${X(m.eleve)}"></div></div>` : ""}
              ${quoteBlock(m.prof, m.appreciation, { small: true })}${chips(ns)}</div>
            <div class="as-v">${m.eleve != null ? fmt(m.eleve, 1) : `<small>${esc(m.statut || "–")}</small>`}${m.classe != null ? `<small>classe ${fmt(m.classe, 1)}</small>` : ""}</div></div>`;
        }).join("")}</div>
        ${[...bySubj].filter(([kk]) => !used.has(kk)).map(([kk, ns]) => `<div class="as-row extra"><div></div><div><div class="as-n">${esc(subj(ns[0].matiere).label)} <span class="m">notes seules (absente du bulletin)</span></div>${chips(ns)}</div><div></div></div>`).join("")}
      </section>`
      : `<section class="card rise"><div class="card-head"><h2>Notes de l'année</h2></div>${[...bySubj].map(([kk, ns]) => `<div class="as-row extra"><div></div><div><div class="as-n">${esc(subj(ns[0].matiere).label)}</div>${chips(ns)}</div><div></div></div>`).join("") || `<div class="empty">Aucune donnée</div>`}</section>`);
  $("#tri")?.addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) { archTri[key] = +b.dataset.t; hideTip(); renderArchives(); } });
}
function renderArchPrimaire(body, prenom, y) {
  const sems = y.semestres || [], key = `${prenom}/${y.annee}`;
  let si = archTri[key] ?? (sems.length ? sems.at(-1).semestre : 0);
  const s = sems.find(x => x.semestre === si) || sems[0];
  if (!s) { body.innerHTML = `<div class="card empty">Aucune donnée extraite.</div>${archFiles(y)}`; return; }
  const disc = new Map();
  for (const o of s.objectifs) (disc.get(o.discipline) || disc.set(o.discipline, []).get(o.discipline)).push(o);
  const count = os => ["Dépassés", "Atteints", "Partiellement atteints", "Non atteints"].map(n => [n, os.filter(o => o.niveau === n).length]).filter(([, c]) => c);
  const bar = os => { const tot = os.length || 1; return `<div class="lvlbar">${count(os).map(([n, c]) => `<i class="${(LVL[n] || [""])[0]} ${n === "Dépassés" ? "plus" : ""}" style="flex:${c}" data-tip="${esc(`${n} : ${c}/${os.length}`)}"></i>`).join("")}${os.filter(o => !o.niveau).length ? `<i class="ne" style="flex:${os.filter(o => !o.niveau).length}"></i>` : ""}</div>`; };
  body.innerHTML = `<section class="card rise arch-head">
      <div><h2>${esc(y.classe)} · ${esc(y.annee)}</h2><div class="m">${esc(y.enseignant || "")}${y.etablissement ? " · " + esc(y.etablissement) : ""}${s.du ? ` · du ${esc(s.du)} au ${esc(s.au)}` : ""}</div></div>
      <span class="spacer"></span>
      ${sems.length > 1 ? `<div class="pills" id="tri">${sems.map(x => `<button type="button" data-t="${x.semestre}" aria-pressed="${x.semestre === s.semestre}">Semestre ${x.semestre}</button>`).join("")}</div>` : `<span class="tag">Semestre ${s.semestre}</span>`}
      ${archFiles(y)}
    </section>
    <section class="minis rise">${count(s.objectifs).map(([n, c]) => `<div class="card mini"><div><b>${c}</b><span>${lvlTag(n)} objectif${c > 1 ? "s" : ""}</span></div></div>`).join("")}</section>
    ${s.appreciation || s.decision ? `<section class="card rise"><div class="sec-title">${ic("chat-circle")}Appréciation générale</div>${quoteBlock(y.enseignant, s.appreciation, { role: "ens", meta: `${y.classe} · semestre ${s.semestre}` })}${s.decision ? `<span class="tag good">${esc(s.decision)}</span>` : ""}</section>` : ""}
    ${s.socle?.length ? `<section class="card rise"><div class="sec-title">${ic("seal-check")}Maîtrise des composantes du socle</div><div class="obj-list">${s.socle.map(c => `<div class="obj"><span>${esc(c.composante)}</span><span class="tag good lvl">${esc(c.niveau)}</span></div>`).join("")}</div></section>` : ""}
    <div class="arch-disc">${[...disc].map(([d, os]) => { const sb = subj(d); return `<section class="card rise" style="${cvar(sb.color)}">
      <div class="disc-h"><span class="bubble sm">${ic(sb.icon)}</span><h3>${esc(d)}</h3><span class="spacer"></span><span class="m">${plural(os.length, "objectif")}</span></div>
      ${bar(os)}
      ${s.commentaires?.[d] ? quoteBlock(y.enseignant, s.commentaires[d], { small: true }) : ""}
      ${(s.notes || []).filter(n => n.discipline === d).map(n => `<p class="disc-com">📝 ${esc(n.domaine)} : ${n.valeurs.map(v => `${v}/${n.sur}`).join(" · ")}</p>`).join("")}
      <div class="obj-list">${os.map(o => `<div class="obj"><span>${o.domaine ? `<small>${esc(o.domaine)}</small>` : ""}${esc(o.objectif)}</span>${lvlTag(o.niveau, o.statut)}</div>`).join("")}</div></section>`; }).join("")}</div>`;
  $("#tri")?.addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) { archTri[key] = +b.dataset.t; hideTip(); renderArchives(); } });
}

// ---------- aperçu d'un espace « dossier » ----------
function renderSApercu(e) {
  const t = today(), d0 = parseDay(t), el = $("#pane-s-apercu");
  const G = DATA.garde, gd = G?.enfants?.includes(e.prenom) ? gardeDays(G, addDays(t, -1), addDays(t, 1)).find(d => d.s === t)?.kids[e.prenom] : null;
  const menus = e.cantine || {}, mDates = Object.keys(menus);
  const focus = mDates.find(d => d > t || (d === t && nowMin() < 13 * 60 + 30));
  const nJ = focus ? dayDiff(t, focus) : null, fLabel = nJ === 0 ? "aujourd'hui" : nJ === 1 ? "demain" : focus ? fdate(focus, { weekday: "long" }) : "";
  const hw = (e.devoirs || []).filter(d => d.date > t && !d.effectue);
  const nextHw = hw[0]?.date, hwNext = hw.filter(d => d.date === nextHw);
  const vac = (DATA.calendrier?.vacances || []).filter(v => v.reprise > v.debut);
  const curV = vac.find(v => v.debut <= t && t < v.reprise), nextV = vac.find(v => v.debut > t);
  const chips = [];
  if (gd) chips.push(["house-line", `Ce soir chez ${PARENT[gd.pm].toLowerCase()}`]);
  if (focus) chips.push(["bowl-food", `Cantine ${fLabel} : ${esc(menuHeadline(menus[focus]))}`]);
  chips.push(hwNext.length ? ["note-pencil", `${plural(hwNext.length, "devoir")} pour ${esc(relDay(nextHw).toLowerCase())}`] : ["drop", "Aucun devoir importé à venir"]);
  if (curV) chips.push(["island", `En vacances · reprise ${esc(relDay(curV.reprise).toLowerCase())}`]);
  else if (nextV) chips.push(["island", `${esc(nextV.nom)} dans ${dayDiff(t, nextV.debut)} jours`]);
  const fm = focus && menus[focus];
  el.innerHTML = `<section class="hero rise">
      <div class="hello"><p class="eyebrow">${esc(cap(d0.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })))}</p>
        <h1>Coucou <span class="grad-text">${esc(e.prenom)}</span> ${ic("sparkle")}</h1>
        <div class="chips">${chips.map(([i, txt]) => `<span class="chip">${ic(i)}<span>${txt}</span></span>`).join("")}</div></div>
      <div class="now s-now" style="--c:var(--${gd?.pm || "papa"})">
        <div class="label">Ce soir</div>
        <div class="row"><div class="emoji">${kidAvatar(e.prenom, 52)}</div><div><h3>${gd ? `Chez ${PARENT[gd.pm].toLowerCase()}` : "–"}</h3>
          <div class="meta">${gd && gd.am !== gd.pm ? `${PARENT[gd.am]} le matin → ${PARENT[gd.pm].toLowerCase()} ${handover(t) === "midi" ? "l'après-midi" : "le soir"}` : gd ? "toute la journée" : "garde non configurée"}</div></div></div>
        <div class="s-now-acts"><button type="button" class="btn" data-go="garde">${ic("calendar-heart")}Voir la garde</button></div>
      </div>
    </section>
    <section class="s-cards rise">
      <div class="card s-card" style="--c:var(--accent)"><div class="sec-title">🍽️ Prochain repas${focus ? ` · ${esc(fLabel)}` : ""}</div>
        ${fm ? (fm.note ? `<p>🎉 ${esc(fm.note)}</p>` : MENU_CATS.filter(([k]) => fm[k]?.length && k !== "laitages").map(([k, em, l]) => `<div class="sc-cat"><span class="em">${em}</span><div><small>${l}</small>${fm[k].map(esc).join(" · ")}</div></div>`).join("")) : emptyState("miam", "Pas de menu importé à venir")}
        <button type="button" class="btn" data-go="s-cantine">Toute la semaine</button></div>
      <div class="card s-card"><div class="sec-title">✏️ Devoirs à venir</div>
        ${hw.length ? `<div class="obj-list">${hw.slice(0, 4).map(d => `<div class="obj"><span><small>${esc(relDay(d.date))}</small>${esc(d.matiere)} · ${esc(d.contenu)}</span>${d.interrogation ? `<span class="tag warn">Contrôle</span>` : ""}</div>`).join("")}</div>` : emptyState("joie", "Rien à faire 🌸")}
        <button type="button" class="btn" data-go="s-devoirs">Tous les devoirs</button></div>
    </section>
    <section class="rise"><div class="sec-head"><h2>Mes comptes à rebours</h2></div><div class="jx-grid" id="s-countdowns"></div></section>`;
  // comptes à rebours : week-end (sortie vendredi 16h30), vacances, anniversaire (espaces.json → "anniversaire")
  const items = [], now = Date.now(), dow = (d0.getDay() + 6) % 7, mon = addDays(t, -dow), fri = addDays(mon, 4);
  const prevSchoolDay = d => { let x = addDays(d, -1); while ([0, 6].includes(parseDay(x).getDay())) x = addDays(x, -1); return x; };
  const OUT_MIN = 16 * 60 + 30, IN_MIN = 8 * 60 + 30;
  if (curV) items.push({ label: "En vacances", title: curV.nom, icon: "island", color: "#8b5cf6", end: at(curV.reprise, IN_MIN), start: at(curV.debut, 0),
    when: `reprise ${fdate(curV.reprise, { weekday: "long", day: "numeric", month: "long" })}` });
  else if (dow < 5 && now < at(fri, OUT_MIN)) items.push({ label: "Week-end", title: "Prochain week-end", icon: "sun", color: "#ff5fa2", end: at(fri, OUT_MIN), start: at(mon, IN_MIN), when: "Vendredi 16h30" });
  if (nextV && !curV) {
    const prevEnd = vac.filter(v => v.reprise <= t).at(-1)?.reprise;
    items.push({ label: "Vacances", title: nextV.nom.replace(/^Vacances (de la |de |d')/i, "").replace(/^./, c => c.toUpperCase()), icon: "island", color: "#8b5cf6",
      end: at(prevSchoolDay(nextV.debut), OUT_MIN), start: prevEnd ? at(prevEnd, IN_MIN) : at(`${t.slice(0, 4) - (d0.getMonth() < 7)}-09-01`, IN_MIN),
      when: `${fdate(nextV.debut, { day: "numeric", month: "short" })} → ${fdate(nextV.reprise, { day: "numeric", month: "short" })}` });
  }
  if (/^\d{4}-\d\d-\d\d$/.test(e.anniversaire || "")) {
    const md = e.anniversaire.slice(5), y0 = +t.slice(0, 4);
    const next = `${y0}-${md}` >= t ? `${y0}-${md}` : `${y0 + 1}-${md}`, prev = `${+next.slice(0, 4) - 1}-${md}`;
    items.push({ label: "Anniversaire", title: `${+next.slice(0, 4) - +e.anniversaire.slice(0, 4)} ans 🎂`, icon: "confetti", color: "#ff9f43",
      end: at(next, 0), start: at(prev, 0), when: cap(fdate(next, { weekday: "long", day: "numeric", month: "long", year: "numeric" })) });
  }
  items.push(lastYearItem(e.prenom), ...eventItems(e.prenom));
  renderJx($("#s-countdowns"), items);
  el.onclick = ev => { const b = ev.target.closest("[data-go]"); if (b) showTab(b.dataset.go); };
}

load();
})();
</script>
</body>
