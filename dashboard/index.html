function defaultDay() {
  const t = today(), days = schoolDays();
  const todays = lessonsOf(t);
  if (todays.length && todays.at(-1).e > nowMin()) return t;
  return days.find(d => d > t && lessonsOf(d).length) || days.find(d => d >= t) || days[0];
}

function renderDay() {
  const days = schoolDays(), t = today(), m = nowMin();
  if (!edtDay || !days.includes(edtDay)) edtDay = defaultDay();
  const chips = days.map((d, i) => {
    const ls = lessonsOf(d);
    const dots = [...new Set(ls.map(l => subj(l.matiere, l.code).color))].slice(0, 5).map(c => `<i style="${cvar(c)}"></i>`).join("");
    return `<button type="button" class="day ${d === t ? "today" : ""} ${i === 5 ? "sep" : ""}" data-d="${d}" aria-pressed="${d === edtDay}">
      <span class="dw">${esc(fdate(d, { weekday: "short" }).replace(".", ""))}</span><span class="dn">${parseDay(d).getDate()}</span><span class="dd">${dots}</span></button>`;
  }).join("");
  const ls = lessonsOf(edtDay), menu = menuOf(edtDay);
  let tl = "";
  ls.forEach((l, i) => {
    if (i > 0) {
      const gap = l.s - ls[i - 1].e;
      if (gap >= 45 && ls[i - 1].e >= 11 * 60 + 30 && l.s <= 14 * 60 + 30) tl += menu ? lunchZone(edtDay, menu, `pause déj · ${hhmm(gap).replace(/^0h/, "")}`) : `<div class="gap">${ic("bowl-food")}Pause déj · ${hhmm(gap).replace(/^0h/, "")}</div>`;
      else if (gap >= 50) tl += `<div class="gap">${ic("cloud")}Heure libre</div>`;
      else if (gap >= 15) tl += `<div class="gap">${ic("coffee")}Pause · ${gap} min</div>`;
    }
    const s = subj(l.matiere, l.code);
    const isToday = edtDay === t, past = isToday && l.e <= m, live = isToday && l.s <= m && m < l.e && !l.annule;
    const tags = [
      l.annule && `<span class="tag crit">${ic("x-circle")}Annulé</span>`,
      l.modifie && !l.annule && `<span class="tag warn">${ic("pencil-simple")}Modifié</span>`,
      l.n > 1 && `<span class="tag">${l.n}h</span>`,
      l.devoir && `<span class="tag">${ic("note-pencil")}Devoir</span>`,
      l.seance && `<span class="tag">${ic("book-open")}Contenu de séance</span>`,
      l.dispense && `<span class="tag good">${ic("check-circle")}Dispensée</span>`,
    ].filter(Boolean).join("");
    tl += `<div class="slot">
      <div class="t"><b>${hhmm(l.s)}</b><span>${hhmm(l.e)}</span></div>
      <div class="lesson ${l.annule ? "cancel" : ""} ${past ? "past" : ""} ${live ? "live" : ""}" style="${cvar(s.color)}">
        <div class="bubble">${ic(s.icon)}</div>
        <div style="min-width:0">
          <h4><span class="n">${esc(s.label)}</span></h4>
          <div class="m">${l.prof ? teacherPortrait(l.prof, 22) : ""}${[esc(salle(l.salle)), esc(l.prof)].filter(Boolean).join(" · ")}</div>
          ${tags ? `<div class="tags">${tags}</div>` : ""}
        </div>
        ${live ? `<div class="live-bar"><i style="width:${(m - l.s) / (l.e - l.s) * 100}%"></i></div>` : ""}
      </div></div>`;
  });
  // menu publié mais pas de pause déj repérée (cours jusqu'à midi seulement…) : zone cantine en fin de matinée
  if (menu && ls.length && !lunchGap(ls) && ls.at(-1).e <= 13 * 60 + 30) tl += lunchZone(edtDay, menu);
  if (!ls.length) tl = emptyState("dodo", "Pas de cours ce jour-là");
  else {
    const first = ls.find(l => !l.annule), last = [...ls].reverse().find(l => !l.annule);
    if (first) tl = `<div class="gap" style="margin-left:0;margin-bottom:2px">${ic("sun-horizon")}${esc(relDay(edtDay, true))} · de ${hhmm(first.s)} à ${hhmm(last.e)}</div>` + tl;
  }
  $("#edt").innerHTML = `<div class="days" id="days">${chips}</div><div class="timeline">${tl}</div>`;
  $("#days").onclick = e => { const b = e.target.closest(".day"); if (!b) return; edtDay = b.dataset.d; renderDay(); };
  $("#days").querySelector('[aria-pressed="true"]')?.scrollIntoView({ block: "nearest", inline: "center" });
}

function renderWeek() {
  const days = schoolDays().slice(edtWeek * 5, edtWeek * 5 + 5), t = today(), m = nowMin();
  const all = days.map(d => lessonsOf(d));
  let h0 = 8, h1 = 17;
  for (const ls of all) for (const l of ls) { h0 = Math.min(h0, Math.floor(l.s / 60)); h1 = Math.max(h1, Math.ceil(l.e / 60)); }
  const PX = 58, H = (h1 - h0) * PX, y = mm => (mm - h0 * 60) / 60 * PX;
  let html = `<div class="week"><div></div>` + days.map(d =>
    `<div class="wh ${d === t ? "today" : ""}"><div class="dw">${esc(fdate(d, { weekday: "short" }).replace(".", ""))}</div><span class="dn">${parseDay(d).getDate()}</span></div>`).join("");
  html += `<div class="hours" style="height:${H}px">${[...Array(h1 - h0 + 1)].map((_, i) => `<span style="top:${i * PX}px">${h0 + i}h</span>`).join("")}</div>`;
  days.forEach((d, di) => {
    html += `<div class="col ${d === t ? "today" : ""}" style="height:${H}px">`;
    for (const l of all[di]) {
      const s = subj(l.matiere, l.code), top = y(l.s) + 2, h = Math.max(22, y(l.e) - y(l.s) - 4);
      const past = d < t || (d === t && l.e <= m);
      const flag = l.annule ? ic("x-circle") : l.modifie ? ic("pencil-simple") : l.devoir ? ic("note-pencil") : "";
      const tipTxt = `<b>${ic(s.icon)} ${esc(s.label)}</b><br>${hhmm(l.s)} – ${hhmm(l.e)}${l.annule ? " · <b>annulé</b>" : l.modifie ? " · modifié" : ""}<br><span class="muted">${[esc(salle(l.salle)), esc(l.prof)].filter(Boolean).join(" · ")}</span>${l.groupe ? `<br><span class="muted">${esc(l.groupe)}</span>` : ""}`;
      html += `<div class="block ${l.annule ? "cancel" : ""} ${past ? "past" : ""}" style="top:${top}px;height:${h}px;${cvar(s.color)}" data-tip="${esc(tipTxt)}">
        ${flag ? `<span class="flag">${flag}</span>` : ""}
        <div class="bn">${ic(s.icon)}<span>${esc(s.label)}</span></div>
        ${h > 44 ? `<div class="br">${esc(l.salle || "")}</div>` : ""}</div>`;
    }
    const menu = menuOf(d), lg = menu && all[di].length && (lunchGap(all[di]) || (all[di].at(-1).e <= 13 * 60 + 30 ? [Math.max(all[di].at(-1).e, 12 * 60), Math.max(all[di].at(-1).e, 12 * 60) + 60] : null));
    if (lg) {
      const top = y(lg[0]) + 2, h = Math.max(24, y(lg[1]) - y(lg[0]) - 4);
      html += `<div class="lunchblk${d < t ? " past" : ""}" style="top:${top}px;height:${h}px" tabindex="0" data-tip="${esc(menuTip(d, menu))}">
        <div class="bn">🍽️<span>Cantine</span></div>${h > 40 ? `<div class="br">${esc(menuHeadline(menu))}</div>` : ""}</div>`;
    }
    if (d === t && m >= h0 * 60 && m <= h1 * 60) html += `<div class="nowline" style="top:${y(m)}px"></div>`;
    html += `</div>`;
  });
  html += `</div>`;
  if (!all.some(ls => ls.length)) html += emptyState("dodo", "Pas de cours cette semaine");
  $("#edt").innerHTML = `<div class="week-wrap">${html}</div>`;
}

function renderDevoirs() {
  const t = today();
  $("#hwfilter").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === hwFilter)));
  const up = (kid.devoirs || []).filter(d => d.date >= t);
  $("#hwsub").textContent = `${up.filter(d => !d.effectue).length} à faire`;

function renderCourbe(notes) {
  const el = $("#courbe");
  const sorted = notes.filter(valid).sort((a, b) => a.date.localeCompare(b.date));
  const dates = [...new Set(sorted.map(n => n.date))];
  if (dates.length < 2) { el.innerHTML = `<div class="empty"><span class="big">${ic("chart-line-up")}</span>La courbe apparaîtra avec quelques notes de plus</div>`; return; }
  // moyenne cumulée : moyenne des moyennes par matière à chaque date
  const pts = dates.map(d => {
    const by = new Map();
    for (const n of sorted) if (n.date <= d) { const k = n.codeMatiere || n.matiere; const s = by.get(k) || [0, 0]; s[0] += on20(n.valeur, n.sur) * n.coef; s[1] += n.coef; by.set(k, s); }
    const m = [...by.values()].map(([a, w]) => a / w);
    return { d, v: m.reduce((a, b) => a + b, 0) / m.length };
  });
  const W = 520, H = 200, L = 28, R = 10, T = 14, B = 24;
  const vals = pts.map(p => p.v);
  let lo = Math.max(0, Math.floor(Math.min(...vals) - 1.5)), hi = Math.min(20, Math.ceil(Math.max(...vals) + 1.5));
  if (hi - lo < 4) { lo = Math.max(0, hi - 4); hi = lo + 4; }
  const t0 = parseDay(dates[0]).getTime(), t1 = parseDay(dates.at(-1)).getTime();
  const x = d => L + (parseDay(d).getTime() - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = hi - lo > 8 ? 4 : 2;
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la moyenne">
    <defs>
      <linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#ff5fa2"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
      <linearGradient id="ca" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff5fa2" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
    </defs>`;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  svg += `<text x="${L}" y="${H - 4}">${esc(fdate(dates[0], { day: "numeric", month: "short" }))}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${esc(fdate(dates.at(-1), { day: "numeric", month: "short" }))}</text>`;
  svg += `<path d="${line}L${x(dates.at(-1))},${H - B}L${x(dates[0])},${H - B}Z" fill="url(#ca)"/>`;
  svg += `<path d="${line}" fill="none" stroke="url(#cg)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last = pts.at(-1);
  svg += `<circle cx="${x(last.d)}" cy="${y(last.v)}" r="5.5" fill="#8b5cf6" stroke="var(--card-solid)" stroke-width="2.5"/>`;
  svg += `<line id="xh" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><circle id="xd" r="5.5" fill="#ff5fa2" stroke="var(--card-solid)" stroke-width="2.5" visibility="hidden"/>`;
  svg += `<rect id="hit" x="${L}" y="0" width="${W - L - R}" height="${H - B}" fill="transparent"/></svg>`;
  el.innerHTML = `<div class="chart">${svg}</div>`;
  const s = el.querySelector("svg"), xh = s.querySelector("#xh"), xd = s.querySelector("#xd"), hit = s.querySelector("#hit");
  hit.onmousemove = e => {
    e.stopPropagation();
    const r = s.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width * W;
    let best = pts[0]; for (const p of pts) if (Math.abs(x(p.d) - mx) < Math.abs(x(best.d) - mx)) best = p;
    xh.setAttribute("x1", x(best.d)); xh.setAttribute("x2", x(best.d)); xh.setAttribute("visibility", "visible");
    xd.setAttribute("cx", x(best.d)); xd.setAttribute("cy", y(best.v)); xd.setAttribute("visibility", "visible");
    const added = sorted.filter(n => n.date === best.d);
    showTip(`<b>${esc(fdate(best.d, { day: "numeric", month: "long" }))}</b><br>Moyenne : ${fmt(best.v, 2)}<br><span class="muted">${added.map(n => `${ic(subj(n.matiere, n.codeMatiere).icon)} ${esc(subj(n.matiere, n.codeMatiere).label)} ${fmtN(n.valeur)}/${n.sur}`).join("<br>")}</span>`, e);
  };
  hit.onmouseleave = () => { xh.setAttribute("visibility", "hidden"); xd.setAttribute("visibility", "hidden"); hideTip(); };
}

// ---------- sablier ----------
let hgN = 0;
function hourglass(frac, size = 44, running = false) {
  frac = Math.max(0, Math.min(1, frac || 0));
  const id = `hg${++hgN}`, top = 6 + (1 - frac) * 20, bot = 50 - (1 - frac) * 20;
  const bulbT = "M9 6 C9 18 18 23 18 28 L22 28 C22 23 31 18 31 6 Z", bulbB = "M18 28 C18 33 9 38 9 50 L31 50 C31 38 22 33 22 28 Z";
  return `<svg class="hg" width="${size * 40 / 56}" height="${size}" viewBox="0 0 40 56" role="img" aria-label="${Math.round(frac * 100)} % restant">
    <defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7ab6"/><stop offset="1" stop-color="var(--hg, #8b5cf6)"/></linearGradient>
      <clipPath id="${id}t"><path d="${bulbT}"/></clipPath><clipPath id="${id}b"><path d="${bulbB}"/></clipPath></defs>
    <path class="glass" d="${bulbT} ${bulbB}"/>
    <rect clip-path="url(#${id}t)" x="0" y="${top}" width="40" height="${28 - top}" fill="url(#${id}g)"/>
    <rect clip-path="url(#${id}b)" x="0" y="${bot}" width="40" height="${50 - bot}" fill="url(#${id}g)"/>
    ${running && frac > 0 ? `<line class="stream" x1="20" y1="28" x2="20" y2="${bot}"/>` : ""}
    <rect class="cap" x="5" y="2" width="30" height="4.5" rx="2.2"/><rect class="cap" x="5" y="49.5" width="30" height="4.5" rx="2.2"/>
  </svg>`;
}
// Comptes à rebours vivants : <span class="cd" data-e> et sabliers <span class="hgw" data-s data-e>, rafraîchis chaque seconde.
function cdText(ms) {
  if (ms <= 0) return "maintenant";
  const t = Math.floor(ms / 1000), d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return d ? `${d} j ${pad(h)}:${pad(m)}:${pad(s)}` : h ? `${h} h ${pad(m)} min ${pad(s)} s` : `${m} min ${pad(s)} s`;
}
const live = end => `<span class="cd" data-e="${end}">${cdText(end - Date.now())}</span>`;
const hgFrac = (s, e) => (e - Date.now()) / Math.max(1, e - s);
const liveHg = (s, e, size = 44, run = true) => `<span class="hgw" data-s="${s}" data-e="${e}" data-z="${size}" data-r="${run ? 1 : 0}">${hourglass(hgFrac(s, e), size, run)}</span>`;
const at = (dayIso, min) => { const d = parseDay(dayIso); d.setMinutes(min); return d.getTime(); };

const lastSchoolDay = d => { const x = parseDay(d); do x.setDate(x.getDate() - 1); while (x.getDay() === 0 || x.getDay() === 6); return iso(x); };
function renderVacances() {
  const el = $("#vacances"); if (!el) return;
  const cal = DATA.calendrier, t = today();
  const vac = (cal?.vacances || []).filter(v => v.reprise > v.debut);
  $("#vacsub").textContent = cal?.academie ? `Académie de ${cal.academie}${vac[0]?.zone ? " · " + vac[0].zone : ""}` : "";
  if (!vac.length) { el.innerHTML = `<div class="empty"><span class="big">${ic("island")}</span>Calendrier indisponible : ajoute <code>ED_ACADEMIE=…</code> dans <code>.env.local</code> puis <code>python ed_export.py vacances</code>.</div>`; return; }
  const now = new Date(), y = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1;
  const y0 = new Date(y, 8, 1), y1 = new Date(y + 1, 6, 10), span = y1 - y0;
  const X = d => `${Math.max(0, Math.min(100, (d - y0) / span * 100))}%`;
  const inYear = vac.filter(v => parseDay(v.reprise) > y0 && parseDay(v.debut) < y1);
  let strip = `<div class="year"><div class="rail"></div>`;
  for (const v of inYear) {
    const a = parseDay(v.debut), b = parseDay(v.reprise);
    strip += `<div class="hol ${v.reprise <= t ? "past" : ""}" style="left:${X(a)};width:calc(${X(b)} - ${X(a)})" data-tip="${esc(`<b>${esc(v.nom)}</b><br>du ${esc(fdate(v.debut, { day: "numeric", month: "long" }))} au ${esc(fdate(v.reprise, { day: "numeric", month: "long" }))}`)}"></div>`;
  }
  for (const ev of DATA.evenements || []) {
    const a = parseDay(ev.debut), b = parseDay(ev.fin || ev.debut); b.setDate(b.getDate() + 1);
    if (b > y0 && a < y1) strip += `<div class="hol evt" style="left:${X(a)};width:max(6px, calc(${X(b)} - ${X(a)}))" data-tip="${esc(`<b>${esc(ev.nom)}</b><br>${esc(fdate(ev.debut, { day: "numeric", month: "long" }))}${ev.fin ? " → " + esc(fdate(ev.fin, { day: "numeric", month: "long" })) : ""}`)}"></div>`;
  }
  for (let m = 0; m < 11; m++) { const d = new Date(y, 8 + m, 15); if (d < y1) strip += `<span class="mo" style="left:${X(d)}">${esc(new Date(y, 8 + m, 1).toLocaleDateString("fr-FR", { month: "short" }).replace(".", ""))}</span>`; }
  strip += `<div class="todaymk" style="left:${X(now)}"></div></div>`;
  const list = inYear.map(v => {
    const st = v.reprise <= t ? "past" : v.debut <= t ? "now" : "";
    return `<div class="hol-row ${st}"><div><b>${esc(v.nom)}</b><div class="m">${esc(fdate(v.debut, { weekday: "short", day: "numeric", month: "short" }))} → reprise ${esc(fdate(v.reprise, { weekday: "short", day: "numeric", month: "short" }))}</div></div>
      <span class="tag ${st === "now" ? "pop" : ""}">${st === "past" ? "passées" : st === "now" ? "en cours" : `J-${dayDiff(t, lastSchoolDay(v.debut))}`}</span></div>`;
  }).join("");
  el.innerHTML = `${strip}<div class="hol-list">${list}</div>`;
}

// ---------- garde partagée (garde.json) ----------
// Semaine : lun → jeu papa, jeu soir → sam midi maman ; 1 week-end sur 2 chez papa (sam midi → dim).
// Vacances (≥ 1 semaine) : 1 semaine chacun, relais le samedi. Chaque jour = { am, pm } par enfant.
const PARENT = { papa: "Papa", maman: "Maman" };
const handover = s => parseDay(s).getDay() === 6 ? "midi" : "soir"; // samedi : relais à midi
function gardeDays(G, from, to) {
  const other = p => p === "papa" ? "maman" : "papa";
  const vac = (DATA.calendrier?.vacances || []).filter(v => dayDiff(v.debut, v.reprise) >= 7);
  const holiday = s => vac.find(v => v.debut <= s && s < v.reprise);
  const base = (s, prevPm) => {
    const h = holiday(s);
    if (h) {
      const n = dayDiff(h.debut, s), weeks = Math.round(dayDiff(h.debut, h.reprise) / 7);
      const first = G.vacances?.[h.nom] || G.vacancesPremiereSemaine || "maman";
      const p = Math.min(Math.floor(n / 7), weeks - 1) % 2 ? other(first) : first;
      return { am: n % 7 === 0 && prevPm ? prevPm : p, pm: p, vac: h.nom };
    }
    const d = parseDay(s), wd = d.getDay();
    const sat = iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() - (wd === 0 ? 1 : 0)));
    const papaWE = ((Math.round(dayDiff(G.weekendPapa, sat) / 7) % 2) + 2) % 2 === 0;
    return wd >= 1 && wd <= 3 ? { am: "papa", pm: "papa" } : wd === 4 ? { am: "papa", pm: "maman" }
      : wd === 5 ? { am: "maman", pm: "maman" } : wd === 6 ? { am: "maman", pm: papaWE ? "papa" : "maman" }
      : papaWE ? { am: "papa", pm: "papa" } : { am: "maman", pm: "maman" };
  };
  const days = [];
  let prevPm = null;
  for (let d = parseDay(from); iso(d) <= to; d.setDate(d.getDate() + 1)) {
    const s = iso(d), b = base(s, prevPm);
    prevPm = b.pm;
    days.push({ s, vac: b.vac, kids: Object.fromEntries((G.enfants || []).map(k => [k, { am: b.am, pm: b.pm }])) });
  }
  days.forEach((day, i) => {
    const next = days[i + 1];
    for (const k of G.dimancheSoirChezPapa || []) {
      const c = day.kids[k];
      if (c && parseDay(day.s).getDay() === 0 && c.pm === "maman" && next?.kids[k]?.am === "papa") c.pm = "papa";
    }
    for (const x of G.exceptions || []) {
      if (day.s < x.date || day.s > (x.fin || x.date)) continue;
      for (const k of x.enfants || G.enfants || []) if (day.kids[k]) Object.assign(day.kids[k], x.matin && { am: x.matin }, x.soir && { pm: x.soir });
    }
  });
  return days;
}
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return iso(d); };
const mondayOf = s => addDays(s, -((parseDay(s).getDay() + 6) % 7));
let gardeView = store.get("ed-garde-view") === "mois" ? "mois" : "semaine", gardeWeek = null;
// Avatars (SVG maison) : chignon + frange façon geisha, pic à cheveux fleuri ; couleurs dans garde.json → avatars.
function kidAvatar(k, size = 22) {

  const h = a.cheveux || "#1c1720", f = a.fleur || "#ff5fa2";

    <path d="M29.5 47.5q2.5 2.2 5 0" fill="none" stroke="#e0435f" stroke-width="2" stroke-linecap="round"/>

}
const kidName = (k, size) => `<span class="kname">${kidAvatar(k, size)}${esc(k)}</span>`;
function renderGarde() {
  const G = DATA.garde, el = $("#pane-garde");
  if (!G?.enfants?.length) {
    el.innerHTML = paneHead("Garde partagée") + `<div class="card empty"><span class="big">${ic("calendar-heart")}</span>Ajoute <code>garde.json</code> puis relance <code>python ed_export.py normalize</code>.</div>`;
    return;
  }
  const t = today(), d0 = parseDay(t);
  // début d'année scolaire (1er septembre), pas le 1er du mois en cours (sinon fin septembre « hors année » dès octobre)
  const from = `${d0.getFullYear() - (d0.getMonth() < 7 ? 1 : 0)}-09-01`;
  const ete = (DATA.calendrier?.vacances || []).find(v => /été/i.test(v.nom) && v.debut > t);
  const to = addDays(ete ? ete.debut : `${d0.getFullYear() + (d0.getMonth() >= 7 ? 1 : 0)}-07-04`, -1);
  const first = mondayOf(from), last = mondayOf(to);
  const days = gardeDays(G, first, addDays(last, 6)), byDay = new Map(days.map(d => [d.s, d]));
  gardeWeek = gardeWeek || mondayOf(t);
  gardeWeek = gardeWeek < first ? first : gardeWeek > last ? last : gardeWeek;
  const inRange = s => s >= from && s <= to;
  const who = (c, full, s) => c.am === c.pm ? `<span class="p-${c.pm}">${PARENT[c.pm]}</span>`
    : `<span class="p-${c.am}">${PARENT[c.am]}</span>${full ? " le matin" : ""} → <span class="p-${c.pm}">${PARENT[c.pm]}</span>${full ? (handover(s) === "midi" ? " l'après-midi" : " le soir") : ""}`;
  const todayDay = byDay.get(t);
  const tonight = todayDay ? (() => {
    const ps = new Set(G.enfants.map(k => todayDay.kids[k].pm));
    return ps.size === 1 ? `Ce soir, ${G.enfants.join(" et ")} ${G.enfants.length > 1 ? "sont" : "est"} chez ${PARENT[[...ps][0]].toLowerCase()}`
      : "Ce soir : " + G.enfants.map(k => `${k} chez ${PARENT[todayDay.kids[k].pm].toLowerCase()}`).join(" · ");
  })() : "";
  const legend = extra => `<div class="g-legend">
      <span>${parentPortrait("papa", 26)}Papa</span><span>${parentPortrait("maman", 26)}Maman</span>
      <span><i class="g-vac"></i>Vacances scolaires</span>${extra}</div>`;

  let body;
  if (gardeView === "semaine") {
    const wk = [0, 1, 2, 3, 4, 5, 6].map(i => byDay.get(addDays(gardeWeek, i)));
    const a = wk[0].s, b = wk[6].s, n = dayDiff(mondayOf(t), a) / 7;
    const title = `${fdate(a, a.slice(0, 7) === b.slice(0, 7) ? { day: "numeric" } : { day: "numeric", month: "short" })} → ${fdate(b, { day: "numeric", month: "long", year: "numeric" })}`;
    const rel = n === 0 ? "Cette semaine" : n === 1 ? "Semaine prochaine" : n === -1 ? "Semaine dernière" : n > 0 ? `Dans ${n} semaines` : `Il y a ${-n} semaines`;
    const vacs = [...new Set(wk.filter(d => d.vac && inRange(d.s)).map(d => d.vac))];
    const slot = (p, lbl) => `<span class="g-slot" style="--c:var(--${p})">${lbl ? `<small>${lbl}</small>` : ""}${PARENT[p]}</span>`;
    // Passages de relais : changement dans la journée, ou d'un jour sur l'autre (ex. lundi matin à l'école).
    const relais = [];
    wk.forEach((d, i) => {
      if (!inRange(d.s)) return;
      const prev = i ? wk[i - 1] : byDay.get(addDays(d.s, -1));
      const moves = new Map();
      for (const k of G.enfants) {
        const c = d.kids[k], pc = prev?.kids[k];
        if (pc && pc.pm !== c.am) (moves.get(`matin|${c.am}`) || moves.set(`matin|${c.am}`, []).get(`matin|${c.am}`)).push(k);
        const h = `${handover(d.s)}|${c.pm}`;
        if (c.am !== c.pm) (moves.get(h) || moves.set(h, []).get(h)).push(k);
      }
      for (const [key, ks] of moves) {
        const [when, p] = key.split("|");
        relais.push(`<li><b>${esc(cap(fdate(d.s, { weekday: "long", day: "numeric" })))} ${when}</b><span class="kname">${ks.map(k => kidAvatar(k, 22)).join("")}${esc(ks.join(" & "))} → ${parentPortrait(p, 26)}<span class="p-${p}">${PARENT[p]}</span></span></li>`);
      }
    });
    body = `<section class="card g-wnav rise">
        <button type="button" class="icon-btn" id="gprev" aria-label="Semaine précédente" ${gardeWeek <= first ? "disabled" : ""}>${ic("arrow-left")}</button>
        <div class="g-wt"><h2>${esc(title)}</h2>
          <div class="m"><span>${rel}</span>${vacs.map(v => `<span class="tag pop">${esc(v)}</span>`).join("")}</div>
          <div class="g-acts">${n ? `<button type="button" class="btn" id="gtoday">${ic("calendar-heart")}Aujourd'hui</button>` : ""}<button type="button" class="btn" id="gmonth">Voir le mois</button></div></div>
        <button type="button" class="icon-btn g-next" id="gnext" aria-label="Semaine suivante" ${gardeWeek >= last ? "disabled" : ""}>${ic("arrow-left")}</button>
      </section>
      <div class="g-week rise">${wk.map(d => `<div class="g-wd${d.vac && inRange(d.s) ? " g-vac" : ""}${d.s === t ? " today" : ""}${inRange(d.s) ? "" : " off"}">

  el.innerHTML = paneHead("Météo", `${kidName(prenom, 22)} · pendant le temps d'école${cfg ? ` · ${esc(cfg.ville)}` : ""}`) + `<section class="rise wx-tab"></section>`;
  renderMeteoCard(el.querySelector(".wx-tab"), prenom);

// bloc compact « temps d'école » d'un jour (emplois du temps)
function wxDayHtml(m, prenom, d) {
  const span = schoolSpan(prenom, d), w = span && wxSchool(m, d, span), dd = wxDay(m, d);
  if (w) return `<div class="wx-d tone-${WMO(w.code)[0]}">${wxSvg(w.code)}<div><b>${deg(w.debut.t)}<span>→</span>${deg(w.fin.t)}</b>
    <small>${esc(WMO(w.code)[1])}${w.pluie >= 30 ? ` · ${w.pluie} %` : ""}</small></div><em title="${esc([...tenue(w).porter, ...tenue(w).sac].map(([, l]) => l).join(" · "))}">${tenueKey(w).map(cloIc).join("")}</em></div>`;
  if (dd) return `<div class="wx-d off tone-${WMO(dd.code)[0]}">${wxSvg(dd.code)}<div><b>${deg(dd.max)}<span class="mn">${deg(dd.min)}</span></b><small>${esc(WMO(dd.code)[1])}</small></div></div>`;
  return "";
}
// espace EcoleDirecte : bandeau aligné sur les 5 colonnes de l'emploi du temps
async function renderMeteoStrip(el, prenom, days, sel) {
  const cfg = meteoCfg(prenom); if (!el) return;
  const m = cfg && await getMeteo(cfg);
  if (!el.isConnected) return;
  if (!m || !days.some(d => wxDay(m, d))) { el.innerHTML = ""; return; }
  const t = today();
  el.innerHTML = `<div class="wx-strip" style="--n:${days.length}">${days.map(d => `<div class="cell${d === t ? " today" : ""}${d === sel ? " sel" : ""}">${wxDayHtml(m, prenom, d) || `<small class="none">pas encore de prévision</small>`}</div>`).join("")}
    <span class="wx-src">${ic("push-pin")}${esc(cfg.ville)} · pendant les cours</span></div>`;
}
// espace dossier : un bloc en haut de chaque carte jour de la vue semaine
async function fillDayWeather(root, prenom) {
  const cfg = meteoCfg(prenom), m = cfg && await getMeteo(cfg);
  if (!m) return;
  root.querySelectorAll("[data-wx]").forEach(el => { el.innerHTML = wxDayHtml(m, prenom, el.dataset.wx); });
}

// Physique 2D « shape matching » (Müller 2005) : chaque objet = contour de points en Verlet, ramenés vers leur forme
// de repos tournée/étirée (déformation affine à volume constant) → effet gelée. Couteau = découpe du polygone en deux.
const SQ = (() => {
  const TAU = Math.PI * 2, SUB = 8, G = 1500;
  const bump = (th, c, w, h) => { const d = Math.atan2(Math.sin(th - c), Math.cos(th - c)); return h * Math.exp(-((d / w) ** 2)); };
  const polar = (f, sx = 1, sy = 1) => n => [...Array(n)].map((_, i) => { const th = i / n * TAU, r = f(th); return [Math.cos(th) * r * sx, Math.sin(th) * r * sy]; });
  const perim = P => P.reduce((a, p, i) => { const q = P[(i + 1) % P.length]; return a + Math.hypot(q[0] - p[0], q[1] - p[1]); }, 0);
  function resample(P, n) {  // n points répartis régulièrement le long du contour
    const L = perim(P), out = []; let i = 0, acc = 0;
    for (let k = 0; k < n; k++) {
      const want = k / n * L;
      for (;;) { const p = P[i % P.length], q = P[(i + 1) % P.length], l = Math.hypot(q[0] - p[0], q[1] - p[1]);
        if (acc + l >= want || i > 4 * P.length) { const t = l ? (want - acc) / l : 0; out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); break; }
        acc += l; i++; }

    P.forEach((p, i) => { const q = P[(i + 1) % P.length], c = p[0] * q[1] - q[0] * p[1]; A += c; x += (p[0] + q[0]) * c; y += (p[1] + q[1]) * c; });
    return Math.abs(A) < 1e-6 ? [P.reduce((a, p) => a + p[0], 0) / P.length, P.reduce((a, p) => a + p[1], 0) / P.length] : [x / (3 * A), y / (3 * A)];
  }
  const inside = (P, x, y) => { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };

function trimChart(pts) {
  const W = 760, H = 230, L = 34, R = 18, T = 26, B = 30;
  const vals = pts.flatMap(p => [p.moy, p.cls]).filter(v => v != null);
  const lo = Math.max(0, Math.floor(Math.min(...vals) - 1)), hi = Math.min(20, Math.ceil(Math.max(...vals) + 0.5));
  const x = i => L + (pts.length < 2 ? 0 : i * (W - L - R) / (pts.length - 1)), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const line = key => { let d = ""; pts.forEach((p, i) => { if (p[key] == null) return; d += `${d && pts[i - 1]?.[key] != null ? "L" : "M"}${x(i).toFixed(1)} ${y(p[key]).toFixed(1)}`; }); return d; };
  const ticks = []; for (let v = Math.ceil(lo); v <= hi; v += (hi - lo > 6 ? 2 : 1)) ticks.push(v);
  // séparateurs d'année
  const seps = pts.map((p, i) => i && p.annee !== pts[i - 1].annee ? (x(i) + x(i - 1)) / 2 : null).filter(v => v != null);
  return `<svg class="tchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Moyenne par trimestre">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 8}" y="${y(v) + 4}" class="ax" text-anchor="end">${v}</text>`).join("")}
    ${seps.map(sx => `<line x1="${sx}" x2="${sx}" y1="${T - 10}" y2="${H - B}" class="sep"/>`).join("")}
    <path d="${line("cls")}" class="l-cls"/><path d="${line("moy")}" class="l-me"/>
    ${pts.map((p, i) => `<text x="${x(i)}" y="${H - 10}" class="ax" text-anchor="middle">${esc(p.label)}</text>
      ${p.cls != null ? `<circle cx="${x(i)}" cy="${y(p.cls)}" r="3.5" class="d-cls"/>` : ""}
      ${p.moy != null ? `<circle cx="${x(i)}" cy="${y(p.moy)}" r="5" class="d-me${p.live ? " live" : ""}"/>` : ""}
      ${p.mention && MENTION_IC[p.mention] ? `<text x="${x(i)}" y="${y(p.moy) - 11}" text-anchor="middle" class="emo">${MENTION_IC[p.mention]}</text>` : ""}
      <rect x="${x(i) - 20}" y="${T - 14}" width="40" height="${H - T - B + 14}" fill="transparent" data-tip="${esc(`<b>${esc(p.label)}</b> · ${esc(p.annee)}<br>Moyenne : <b>${fmt(p.moy, 2)}</b>${p.cls != null ? `<br>Classe : ${fmt(p.cls, 2)}` : ""}${p.mention ? `<br>${MENTION_IC[p.mention] || ""} ${esc(p.mention)}` : ""}${p.live ? "<br><span class='muted'>estimée depuis les notes</span>" : ""}`)}"/>`).join("")}
    ${pts.length ? `<text x="${x(pts.length - 1)}" y="${y(pts.at(-1).moy) + (pts.at(-1).mention ? 30 : -12)}" text-anchor="middle" class="dl">${fmt(pts.at(-1).moy, 1)}</text>` : ""}
  </svg>`;
}
function spark(series, pts, color) {
  const W = 150, H = 34, P = 5, vals = series.filter(v => v != null);
  if (!vals.length) return "";
  const lo = Math.min(...vals) - 0.5, hi = Math.max(...vals) + 0.5;
  const x = i => P + i * (W - 2 * P) / Math.max(1, series.length - 1), y = v => P + (hi - v) / (hi - lo || 1) * (H - 2 * P);
  let d = ""; series.forEach((v, i) => { if (v == null) return; d += `${d && series[i - 1] != null ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`; });
  const li = series.map((v, i) => v != null ? i : -1).filter(i => i >= 0);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" style="--c:${color}"><path d="${d}"/>
    ${li.map(i => `<circle cx="${x(i)}" cy="${y(series[i])}" r="${i === li.at(-1) ? 3.5 : 2}" class="${i === li.at(-1) ? "end" : ""}"/><rect x="${x(i) - 6}" y="0" width="12" height="${H}" fill="transparent" data-tip="${esc(`<b>${esc(pts[i].label)}</b> · ${fmt(series[i], 1)}`)}"/>`).join("")}</svg>`;
}

      const x = b.p[i * 3], y = b.p[i * 3 + 1], z = b.p[i * 3 + 2], gx = Math.floor(x / cell), gy = Math.floor(y / cell), gz = Math.floor(z / cell);

  // ---- découpe : plan du geste → droite dans le dessin 2D → deux nouveaux coussins ----

        const poly = resample(P, Math.max(18, Math.min(SEG, Math.round(SEG * Math.sqrt(Math.abs(area(P)) / Math.abs(area(b.poly)) ) + 6))));
        const nb = makeBody(b.it, poly, (x, y, z) => { const rx = x - k[0], ry = y - k[1], rz = z - k[2]; return [c[0] + M[0] * rx + M[1] * ry + M[2] * rz, c[1] + M[3] * rx + M[4] * ry + M[5] * rz, c[2] + M[6] * rx + M[7] * ry + M[8] * rz]; });

  // ---- pointeurs ----
  const rel = ev => { const r = renderer.domElement.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top, r]; };
  function rayDir(x, y) { const r = renderer.domElement.getBoundingClientRect(); ndc.set(x / r.width * 2 - 1, -(y / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.ray.direction.clone(); }
  function pickAt(x, y) { const r = renderer.domElement.getBoundingClientRect(); ndc.set(x / r.width * 2 - 1, -(y / r.height) * 2 + 1); ray.setFromCamera(ndc, camera);

  function down(ev) {
    ev.preventDefault(); try { renderer.domElement.setPointerCapture(ev.pointerId); } catch {} sfx.audio();

    if (tool === "couteau") { trails.set(ev.pointerId, [[x, y]]); return; }
    const h = pickAt(x, y); if (!h) return;
    const b = h.b, R = b.it.size * U * .55, idx = [], w = [], off = [];

      if (d < R) { idx.push(i); w.push(1 - d / R * .75); off.push([b.p[i * 3] - h.pt.x, b.p[i * 3 + 1] - h.pt.y, b.p[i * 3 + 2] - h.pt.z]); } }

  }
  function move(ev) {
    const [x, y] = rel(ev), tr = trails.get(ev.pointerId); if (tr) { tr.push([x, y]); if (tr.length > 40) tr.shift(); return; }
    const g = grabs.get(ev.pointerId); if (!g) return; g.x = x; g.y = y;
    rayDir(x, y); const P = new THREE.Vector3(); if (ray.ray.intersectPlane(g.plane, P)) g.t = [P.x, Math.max(.05, P.y), P.z];
  }
  function up(ev) {
    const tr = trails.get(ev.pointerId); if (tr) { trails.delete(ev.pointerId); const a = tr[0], b = tr.at(-1); if (Math.hypot(b[0] - a[0], b[1] - a[1]) > 25) cut(a, b); return; }
    const g = grabs.get(ev.pointerId); if (!g) return; grabs.delete(ev.pointerId); g.b.grabbed = Math.max(0, g.b.grabbed - 1);
    if (Math.hypot(g.x - g.x0, g.y - g.y0) < 6 && performance.now() - g.t0 < 300) { const b = g.b;  // tape : boing
      for (let i = 0; i < b.p.length; i += 3) { b.pp[i] = b.p[i] - (b.p[i] - b.c[0]) * .05; b.pp[i + 1] = b.p[i + 1] - (b.p[i + 1] - b.c[1]) * .05 - .012; b.pp[i + 2] = b.p[i + 2] - (b.p[i + 2] - b.c[2]) * .05; } }
    sfx.boing(Math.max(.6, Math.min(1.6, 60 / g.b.it.size)));
  }

  // ---- rendu ----
  function frame(now) {
    raf = 0; if (!renderer?.domElement.isConnected || !visible()) return;
    const dt = Math.min(1 / 30, (now - last) / 1000 || 1 / 60); last = now;
    for (let i = 0; i < SUB; i++) step(dt / SUB);
    collide();
    for (const b of bodies) {
      b.g.attributes.position.needsUpdate = true; b.g.computeVertexNormals();
      if (b.it.cute) { if (b.ouch > 0) b.ouch--; if (b.blink > 0) b.blink--; else if (Math.random() < .004) b.blink = 9;
        const st = b.ouch > 0 || b.grabbed ? "sq" : b.blink > 0 ? "blink" : ""; if (st !== b.state) { b.state = st; b.mesh.material.map = b.mesh.material.emissiveMap = tex(b.it, st); b.mesh.material.needsUpdate = true; } }
    }
    renderer.render(scene, camera);
    const r = renderer.domElement.getBoundingClientRect(); octx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); octx.clearRect(0, 0, r.width, r.height);

  }
  const visible = () => (DEBUG || !document.hidden) && window.ZZ.tab.endsWith("-squishy");
  function toast(m) { toastMsg = m; toastT = 150; }
  function resize() {
    if (!renderer) return; const st = root.querySelector(".zz-stage"), W = st.getBoundingClientRect().width, H = Math.max(380, Math.min(innerHeight * .64, 660));
    renderer.setSize(W, H); overlay.width = W * devicePixelRatio; overlay.height = H * devicePixelRatio; overlay.style.height = H + "px";
    camera.aspect = W / H; camera.updateProjectionMatrix(); TX = Math.max(2.4, TZ * camera.aspect * .9);
    const sc = light.shadow.camera; sc.left = -TX - 1; sc.right = TX + 1; sc.top = TZ + 2; sc.bottom = -TZ - 2; sc.updateProjectionMatrix();
  }
  function setupScene(stage) {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" }); renderer.setPixelRatio(Math.min(1.5, devicePixelRatio || 1));
    renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1;  // Neutral : ne délave pas les couleurs (ACES si) renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    light = new THREE.DirectionalLight(0xfff1e6, 2.8); light.position.set(-3, 8, 5); light.castShadow = true; light.shadow.mapSize.set(1024, 1024); light.shadow.radius = 6; light.shadow.bias = -.0004; scene.add(light);
    floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: .28, color: 0x6a1b4d })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  }
  function mount(el) {
    if (renderer) { bodies.forEach(b => { b.g.dispose(); b.mesh.material.dispose(); }); bodies = []; renderer.dispose(); renderer = null; }
    root = el; grabs.clear(); trails.clear();
    el.innerHTML = paneHead(esc(window.ZZ.zzTitle()), "Attrape, étire, lance… et tranche au couteau ! Plusieurs doigts en même temps, c'est encore mieux.") +
      `<section class="card zz rise">
        <div class="zz-bar">
          <div class="pills" id="zz-tool"><button type="button" data-t="main">${ic("sparkle")}Main</button><button type="button" data-t="couteau">${ic("pencil-simple-line")}Couteau</button></div>
          <label class="zz-firm">Moelleux <input type="range" min="0" max="1" step=".05" value="${firm}" id="zz-firm"> Ferme</label>
          <span class="spacer"></span>
          <button type="button" class="btn" id="zz-shake">${ic("confetti")}Secouer</button>
          <button type="button" class="btn" id="zz-clear">${ic("x-circle")}Tout ranger</button>
          <button type="button" class="btn" id="zz-sound">${ic("headphones")}<span></span></button>
          ${zzModeSwitch("3d")}
        </div>
        <div class="zz-stage zz-3d"><canvas class="zz-ov"></canvas><div class="zz-toast"></div><div class="zz-hint" hidden>Choisis une gelée en bas pour la faire tomber</div></div>
        <div class="zz-cats pills" id="zz-cats">${CATS.map(([id, l]) => `<button type="button" data-c="${id}">${l}</button>`).join("")}</div>
        <div class="zz-items" id="zz-items"></div>

    const stage = el.querySelector(".zz-stage"); overlay = stage.querySelector(".zz-ov"); octx = overlay.getContext("2d");

    const tools = () => el.querySelectorAll("#zz-tool button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === tool)));
    el.querySelector("#zz-tool").onclick = ev => { const b = ev.target.closest("button"); if (b) { tool = b.dataset.t; stage.dataset.tool = tool; tools(); } }; tools(); stage.dataset.tool = tool;
    el.querySelector("#zz-firm").oninput = ev => { firm = +ev.target.value; };
    el.querySelector("#zz-shake").onclick = () => { bodies.forEach(b => { const kx = (Math.random() - .5) * .03, kz = (Math.random() - .5) * .03; for (let i = 0; i < b.pp.length; i += 3) { b.pp[i] = b.p[i] - kx; b.pp[i + 1] = b.p[i + 1] - .06 - Math.random() * .01; b.pp[i + 2] = b.p[i + 2] - kz; } }); sfx.boing(.8); };
    el.querySelector("#zz-clear").onclick = () => { [...bodies].forEach(remove); grabs.clear(); hint(); };
    const snd = () => { el.querySelector("#zz-sound span").textContent = sfx.on ? "Son" : "Muet"; el.querySelector("#zz-sound").classList.toggle("off", !sfx.on); };
    el.querySelector("#zz-sound").onclick = () => { sfx.on = !sfx.on; snd(); }; snd();
    const cats = () => { el.querySelectorAll("#zz-cats button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === cat)));
      el.querySelector("#zz-items").innerHTML = ITEMS.filter(x => x.cat === cat).map(it => `<button type="button" data-i="${it.id}"><img alt="" src="${thumb(it)}"><span>${esc(it.nom)}</span></button>`).join(""); };
    // une seule catégorie par scène : changer de catégorie range la table
    el.querySelector("#zz-cats").onclick = ev => { const b = ev.target.closest("button"); if (!b || b.dataset.c === cat) return;
      cat = b.dataset.c; cats(); [...bodies].forEach(remove); grabs.clear(); ITEMS.filter(x => x.cat === cat).slice(0, 2).forEach(x => spawn(x.id)); sfx.boing(1); hint(); }; cats();
    el.querySelector("#zz-items").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; sfx.audio();
      if (bodies.length >= MAX) return toast(TROP);

    const r = renderer.domElement.getBoundingClientRect(), v = new THREE.Vector3();
    document.documentElement.dataset.zz3 = JSON.stringify(bodies.map(x => { v.set(...x.c).project(camera); return [x.it.id, +x.c[1].toFixed(2), Math.round((v.x + 1) / 2 * r.width), Math.round((1 - v.y) / 2 * r.height), +x.g.attributes.normal.array[1].toFixed(2)]; }));
  });

})();
dispatchEvent(new Event("sq3-ready"));
</script>
